name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit suite
        run: PYTHONPATH=src:tests python3 -m unittest discover -s tests -v
      - name: Eight review rounds
        run: python3 reviews/run_rounds.py ci
      - name: Behaviour lock
        run: python3 tests/behavior_lock.py --check
      - name: Launcher smoke test
        run: ./seal demo --json
